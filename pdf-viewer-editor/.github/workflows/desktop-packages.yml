name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: pdf-viewer-editor
      - run: pnpm run electron:build:${{ matrix.target }}
        working-directory: pdf-viewer-editor
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: pdf-viewer-editor/dist/electron/**
          if-no-files-found: error
